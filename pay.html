<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оплата | МедАналіз ЦПМСД №2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#333;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:16px;padding:32px;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.logo{font-size:36px;margin-bottom:8px}
h1{font-size:20px;color:#1e6b1a;margin-bottom:16px}
.amount{font-size:36px;font-weight:800;color:#1e6b1a;margin:16px 0}
.order{font-size:14px;color:#888;margin-bottom:20px}
.btn{display:block;width:100%;background:#3aaa35;color:#fff;font-size:18px;font-weight:700;padding:16px;border:none;border-radius:12px;cursor:pointer;margin-bottom:12px}
.btn:hover{background:#2d8a2d}
.info{font-size:12px;color:#999;line-height:1.6;margin-top:16px}
.spinner{display:none;margin:20px auto;width:40px;height:40px;border:4px solid #e8edf3;border-top-color:#3aaa35;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KSKCHVCNQ6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-KSKCHVCNQ6');
</script>
</head>
<body>
<div class="card">
  <div class="logo">🏥</div>
  <h1>КНП ЦПМСД №2</h1>
  <div style="font-size:14px;color:#555;margin-bottom:16px">Оплата лабораторних послуг</div>
  
  <div class="amount" id="amount">— грн</div>
  <div class="order" id="orderInfo"></div>
  
  <div class="spinner" id="spinner"></div>
  
  <button class="btn" id="payBtn" onclick="startPayment()">💳 Оплатити карткою</button>
  
  <div class="info">
    Безпечна оплата через LiqPay<br>
    КНП ЦПМСД №2 Дарницького району м. Києва
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var orderNum = params.get("order") || "MA-000";
var amount = parseFloat(params.get("amount")) || 0;

document.getElementById("amount").textContent = amount.toFixed(2) + " грн";
document.getElementById("orderInfo").textContent = "Замовлення: " + orderNum;

function sha1(msg){
  function rotl(n,s){return(n<<s)|(n>>>(32-s));}
  var K=[0x5A827999,0x6ED9EBA1,0x8F1BBCDC,0xCA62C1D6];
  var H=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];
  var bytes=[];
  for(var i=0;i<msg.length;i++){
    var c=msg.charCodeAt(i);
    if(c<128)bytes.push(c);
    else if(c<2048){bytes.push((c>>6)|192);bytes.push((c&63)|128);}
    else{bytes.push((c>>12)|224);bytes.push(((c>>6)&63)|128);bytes.push((c&63)|128);}
  }
  var l=bytes.length;
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  var bits=l*8;
  bytes.push(0,0,0,0);
  bytes.push((bits>>>24)&0xff,(bits>>>16)&0xff,(bits>>>8)&0xff,bits&0xff);
  for(var block=0;block<bytes.length;block+=64){
    var W=[];
    for(var t=0;t<16;t++)W[t]=(bytes[block+t*4]<<24)|(bytes[block+t*4+1]<<16)|(bytes[block+t*4+2]<<8)|bytes[block+t*4+3];
    for(var t=16;t<80;t++)W[t]=rotl(W[t-3]^W[t-8]^W[t-14]^W[t-16],1);
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4];
    for(var t=0;t<80;t++){
      var f,k;
      if(t<20){f=(b&c)|((~b)&d);k=K[0];}
      else if(t<40){f=b^c^d;k=K[1];}
      else if(t<60){f=(b&c)|(b&d)|(c&d);k=K[2];}
      else{f=b^c^d;k=K[3];}
      var temp=(rotl(a,5)+f+e+k+W[t])>>>0;
      e=d;d=c;c=rotl(b,30)>>>0;b=a;a=temp;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;
  }
  var result=[];
  for(var i=0;i<5;i++){result.push((H[i]>>>24)&0xff,(H[i]>>>16)&0xff,(H[i]>>>8)&0xff,H[i]&0xff);}
  return result;
}

function startPayment(){
  if(!amount){alert("Помилка: сума не вказана");return;}
  
  document.getElementById("spinner").style.display="block";
  document.getElementById("payBtn").style.display="none";
  
  var pk = "zyqdZkoUA6cR69gYJgzUYiBjXsEYKKuMP4F5fkHf";
  var params = {
    public_key:"i77007961154",
    version:"3",
    action:"pay",
    amount:amount,
    currency:"UAH",
    description:"Medical CPMSD2 "+orderNum,
    order_id:orderNum,
    result_url:"https://medanaliz-cpmsd2.netlify.app"
  };
  
  var data = btoa(JSON.stringify(params));
  var signStr = pk + data + pk;
  var hashBytes = sha1(signStr);
  var hashBin = "";
  for(var i=0;i<hashBytes.length;i++) hashBin += String.fromCharCode(hashBytes[i]);
  var signature = btoa(hashBin);
  
  var form = document.createElement("form");
  form.method = "POST";
  form.action = "https://www.liqpay.ua/api/3/checkout";
  form.style.display = "none";
  var i1 = document.createElement("input");
  i1.type="hidden";i1.name="data";i1.value=data;
  var i2 = document.createElement("input");
  i2.type="hidden";i2.name="signature";i2.value=signature;
  form.appendChild(i1);form.appendChild(i2);
  document.body.appendChild(form);
  form.submit();
}
</script>
</body>
</html>
